name: Build Zad Alduat Mobile APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Dependencies
      run: npm install --legacy-peer-deps

    - name: Build Web Assets
      run: |
        npm run build || npx vite build || true

    - name: Prepare Local Assets Directory
      run: |
        mkdir -p dist
        if [ -d ".output/public" ]; then cp -r .output/public/* dist/; fi
        if [ -d "build" ]; then cp -r build/* dist/; fi
        
        # إنشاء ملف مدخل يضمن عدم توقف Capacitor وعدم ظهور شاشة سوداء
        cat << 'EOF' > dist/index.html
        <!DOCTYPE html>
        <html lang="ar" dir="rtl">
        <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>زاد الدعاة</title>
          <style>
            body { margin: 0; background-color: #0B0B0B; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; }
          </style>
        </head>
        <body>
          <script>
            window.location.href = "https://zad-alduat.lovable.app";
          </script>
        </body>
        </html>
        EOF

    - name: Configure Capacitor
      run: |
        cat << 'EOF' > capacitor.config.json
        {
          "appId": "app.lovable.zadalduat",
          "appName": "زاد الدعاة",
          "webDir": "dist",
          "server": {
            "androidScheme": "https",
            "allowNavigation": [
              "zad-alduat.lovable.app",
              "*.lovable.app"
            ]
          },
          "android": {
            "backgroundColor": "#0B0B0B"
          }
        }
        EOF

    - name: Sync Capacitor Android
      run: |
        rm -rf android
        npx cap add android
        npx cap sync android

    - name: Force Fix Android Icons
      run: |
        rm -rf android/app/src/main/res/mipmap-anydpi-v26
        ICON_SRC=$(find public src -name "*icon-512*.png" -o -name "*logo*.png" -o -name "*favicon*.png" | head -n 1)
        if [ -z "$ICON_SRC" ]; then ICON_SRC="public/favicon.ico"; fi
        
        for dir in android/app/src/main/res/mipmap-*; do
          if [ -d "$dir" ]; then
            cp -f "$ICON_SRC" "$dir/ic_launcher.png" 2>/dev/null || true
            cp -f "$ICON_SRC" "$dir/ic_launcher_round.png" 2>/dev/null || true
            cp -f "$ICON_SRC" "$dir/ic_launcher_foreground.png" 2>/dev/null || true
          fi
        done

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Build APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: zad-alduat-app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
