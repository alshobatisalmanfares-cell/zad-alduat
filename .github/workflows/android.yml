name: Build Zad Alduat Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web app
        run: npm run build

      - name: Collect web assets into dist
        run: |
          mkdir -p dist
          if [ -d ".output/public" ]; then cp -r .output/public/. dist/; fi
          if [ -d "dist/client" ]; then cp -r dist/client/. dist/; fi
          test -n "$(ls dist/assets 2>/dev/null)" || { echo "No built assets found"; exit 1; }
          if [ ! -f dist/index.html ]; then
            echo '<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>زاد الدعاة</title></head><body><div id="root"></div></body></html>' > dist/index.html
          fi

      - name: Add & sync Android platform
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: zad-alduat-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
