name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Dependencies
      run: npm install

    # 1. البناء الإجباري في مجلد dist
    - name: Build Web Assets
      run: |
        npm run build
        # إذا لم يكن هناك مجلد dist، أنشئ واحداً وانقل محتويات build إليه (أغلب مشاريع الويب تستخدم build)
        if [ ! -d "dist" ] && [ -d "build" ]; then mv build dist; fi
        if [ ! -d "dist" ] && [ -d "out" ]; then mv out dist; fi
        if [ ! -d "dist" ]; then mkdir -p dist; fi

    # 2. تجهيز الإعدادات قبل إضافة أندرويد
    - name: Configure Capacitor
      run: |
        # التأكد من أن الإعدادات تشير إلى dist
        echo '{"webDir": "dist", "appName": "Zad Al-Duat", "appId": "com.zad.alduat"}' > capacitor.config.json

    - name: Clean & Add Capacitor Android
      run: |
        rm -rf android
        npx cap add android
        npx cap sync android

    # 3. الأيقونة
    - name: Generate App Icons
      run: |
        npm install @capacitor/assets
        npx @capacitor/assets generate --iconPath public/icon-512.png --android || true

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: zad-alduat-app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
