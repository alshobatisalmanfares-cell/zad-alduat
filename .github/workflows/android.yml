name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Dependencies
      run: npm install

    - name: Build Web Assets
      run: npm run build

    - name: Fix Dist Folder and Index File
      run: |
        # طباعة شجرة الملفات لكتشاف مجلد البناء الحقيقي
        echo "=== Current Directory Contents ==="
        ls -la
        
        # البحث عن أي مجلد يحتوي على index.html
        TARGET_DIR=$(find . -maxdepth 3 -name "index.html" ! -path "*/node_modules/*" ! -path "*/android/*" | head -n 1)
        
        if [ -n "$TARGET_DIR" ]; then
          DIR_PATH=$(dirname "$TARGET_DIR")
          echo "Found index.html in: $DIR_PATH"
          mkdir -p dist
          cp -r $DIR_PATH/* dist/
        else
          echo "No index.html found. Creating fallback..."
          mkdir -p dist
          echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>App</title></head><body><div id="root"><h1>App Loaded</h1></div></body></html>' > dist/index.html
        fi

    - name: Add and Sync Capacitor Android
      run: |
        rm -rf android
        npx cap add android
        npx cap sync android

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Build APK with Gradle Wrapper Direct
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: zad-alduat-app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
