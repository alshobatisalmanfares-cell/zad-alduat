name: Build Zad AlDuat Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21


      - name: Install dependencies
        run: npm install --legacy-peer-deps


      - name: Build web app
        run: npm run build


      - name: Prepare Capacitor web folder
        run: |
          echo "Preparing dist folder..."

          rm -rf dist
          mkdir -p dist

          if [ -f ".output/public/index.html" ]; then
            echo "Using .output/public"
            cp -r .output/public/* dist/

          elif [ -f "dist/index.html" ]; then
            echo "Using existing dist"

          else
            echo "Searching for index.html..."
            INDEX=$(find . -path "./node_modules" -prune -o -name index.html -print | head -n 1)

            if [ -n "$INDEX" ]; then
              echo "Found: $INDEX"
              cp "$INDEX" dist/index.html
            else
              echo "No index.html found"
              exit 1
            fi
          fi


      - name: Verify web build
        run: |
          echo "Final dist content:"
          ls -la dist

          if [ ! -f dist/index.html ]; then
            echo "index.html still missing"
            exit 1
          fi


      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps


      - name: Clean Android
        run: |
          rm -rf android


      - name: Add Android
        run: |
          npx cap add android


      - name: Sync Capacitor
        run: |
          npx cap sync android


      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zad-alduat-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
