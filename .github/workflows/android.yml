name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: setup-node@v4
      with:
        node-version: 22

    - name: Install Dependencies
      run: npm install

    - name: Build Web Assets (Force dist folder)
      run: npx vite build --outDir dist

    - name: Verify dist folder
      run: |
        echo "Checking for index.html in dist..."
        ls -la dist/index.html || exit 1

    - name: Add and Sync Capacitor Android
      run: |
        rm -rf android
        npx cap add android
        # التأكد من أن الإعدادات تقرأ من dist
        sed -i 's/"webDir": .*/"webDir": "dist",/' capacitor.config.json || echo '{"webDir": "dist"}' > capacitor.config.json
        npx cap sync android

    - name: Generate App Icons
      run: |
        npm install @capacitor/assets
        npx @capacitor/assets generate --iconPath public/icon-512.png

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Build APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: zad-alduat-app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
