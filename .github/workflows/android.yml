name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Dependencies
      run: npm install

    - name: Build Web Assets (Force OutDir)
      run: npx vite build --outDir dist || npm run build

    - name: Ensure Dist Structure
      run: |
        mkdir -p dist
        # البحث في كافة المجلدات المحتملة (dist, build, out, public)
        for dir in build out public; do
          if [ -d "$dir" ] && [ -f "$dir/index.html" ]; then
            cp -r $dir/* dist/
          fi
        done
        
        # إذا لم يتم العثور على index.html إطلاقاً يتم نسسخه من الجذور
        if [ ! -f "dist/index.html" ] && [ -f "index.html" ]; then
          cp index.html dist/
        fi

    - name: Clean & Add Capacitor Android
      run: |
        rm -rf android
        npx cap add android
        npx cap sync android

    - name: Generate App Icons
      run: |
        npm install @capacitor/assets
        npx @capacitor/assets generate --iconPath public/icon-512.png --android || true

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Build APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: zad-alduat-app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
