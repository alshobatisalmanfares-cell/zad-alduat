name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Dependencies
      run: npm install

    - name: Build Web Assets
      run: npm run build

    - name: Ensure Dist and index.html Exist
      run: |
        mkdir -p dist
        if [ -f "build/index.html" ]; then
          cp -r build/* dist/
        elif [ -f "out/index.html" ]; then
          cp -r out/* dist/
        elif [ -f "public/index.html" ] && [ ! -f "dist/index.html" ]; then
          cp public/index.html dist/index.html
        fi
        if [ ! -f "dist/index.html" ]; then
          echo '<!DOCTYPE html><html><head><title>Zad Alduat</title></head><body><div id="root"></div></body></html>' > dist/index.html
        fi

    - name: Add and Sync Capacitor Android
      run: |
        if [ ! -d "android" ]; then
          npx cap add android
        fi
        npx cap sync android

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build APK with Gradle Wrapper Direct
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: zad-alduat-app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
