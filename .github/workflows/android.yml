name: Build Zad Alduat Native APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Dependencies
      run: npm install --legacy-peer-deps

    - name: Build Web Assets
      run: |
        npm run build
        
        # إنشاء مجلد dist
        mkdir -p dist
        
        # البحث عن ملف index.html المولد ونقل كافة أصول المجلد الخاص به إلى dist
        INDEX_PATH=$(find . -name "index.html" ! -path "*/node_modules/*" ! -path "*/android/*" ! -path "./dist/*" | head -n 1)
        if [ -n "$INDEX_PATH" ]; then
          SRC_DIR=$(dirname "$INDEX_PATH")
          echo "Found index.html in $SRC_DIR, copying contents to dist..."
          cp -r $SRC_DIR/* dist/
        fi
        
        # التحقق النهائي من وجود index.html
        if [ ! -f "dist/index.html" ]; then
          echo "Error: index.html not found anywhere in build output"
          exit 1
        fi

    - name: Configure Capacitor
      run: |
        cat << 'EOF' > capacitor.config.json
        {
          "appId": "app.lovable.zadalduat",
          "appName": "زاد الدعاة",
          "webDir": "dist",
          "android": {
            "backgroundColor": "#0B0B0B"
          }
        }
        EOF

    - name: Sync Capacitor
      run: |
        rm -rf android
        npx cap add android
        npx cap sync android

    - name: Fix Android Icons
      run: |
        rm -rf android/app/src/main/res/mipmap-anydpi-v26
        ICON_SRC=$(find public -name "*icon-512*.png" -o -name "*logo*.png" -o -name "*favicon*.png" | head -n 1)
        if [ -n "$ICON_SRC" ]; then
          for dir in android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ]; then
              cp -f "$ICON_SRC" "$dir/ic_launcher.png" 2>/dev/null || true
              cp -f "$ICON_SRC" "$dir/ic_launcher_round.png" 2>/dev/null || true
              cp -f "$ICON_SRC" "$dir/ic_launcher_foreground.png" 2>/dev/null || true
            fi
          done
        fi

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Build Standalone APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload Native APK
      uses: actions/upload-artifact@v4
      with:
        name: zad-alduat-native-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
