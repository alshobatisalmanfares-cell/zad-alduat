name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Dependencies
      run: npm install

    - name: Build Web Assets
      run: npm run build || true

    - name: Ensure Dist Directory
      run: |
        mkdir -p dist
        if [ -d "build" ]; then cp -r build/* dist/; fi
        if [ -d "out" ]; then cp -r out/* dist/; fi
        echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>زاد الدعاة</title><style>body,html{margin:0;padding:0;width:100%;height:100%;overflow:hidden}iframe{width:100%;height:100%;border:none}</style></head><body><iframe src="https://zad-alduat.lovable.app"></iframe></body></html>' > dist/index.html

    - name: Configure Capacitor
      run: |
        echo '{"appId":"com.zad.alduat","appName":"زاد الدعاة","webDir":"dist","server":{"url":"https://zad-alduat.lovable.app","cleartext":true}}' > capacitor.config.json

    - name: Clean & Sync Capacitor Android
      run: |
        rm -rf android
        npx cap add android
        npx cap sync android

    - name: Force Overwrite Android Icons Directly
      run: |
        # البحث عن صورة الأيقونة في المشروع (icon-512.png أو favicon أو غيرها)
        ICON_SRC=$(find public src -name "*icon-512*.png" -o -name "*logo*.png" -o -name "*favicon*.png" | head -n 1)
        
        if [ -z "$ICON_SRC" ]; then
          ICON_SRC="public/icon-512.png"
        fi
        
        echo "Using icon source: $ICON_SRC"
        
        # استبدال جميع أيقونات أندرويد الافتراضية مباشرة بصورتك
        for dir in android/app/src/main/res/mipmap-*; do
          if [ -d "$dir" ]; then
            cp -f "$ICON_SRC" "$dir/ic_launcher.png"
            cp -f "$ICON_SRC" "$dir/ic_launcher_round.png"
            cp -f "$ICON_SRC" "$dir/ic_launcher_foreground.png"
          fi
        done

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Build APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: zad-alduat-app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
