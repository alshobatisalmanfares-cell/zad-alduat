name: Build Zad AlDuat Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build app
        run: npm run build

      - name: Prepare Capacitor assets
        run: |
          echo "Preparing web assets..."

          if [ ! -f .output/public/index.html ]; then
            echo "Creating index.html"

            cat > .output/public/index.html <<'EOF'
          <!doctype html>
          <html lang="ar" dir="rtl">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>زاد الدعاة</title>
          </head>
          <body>
            <div id="root"></div>
          </body>
          </html>
          EOF
          fi

          ls -la .output/public

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

      - name: Add Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zad-alduat-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
