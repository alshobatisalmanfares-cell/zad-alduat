name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Dependencies
      run: npm install

    - name: Build Web Assets
      run: npm run build

    - name: Prepare Dist Directory
      run: |
        mkdir -p dist
        FOUND_INDEX=$(find . -maxdepth 4 -name "index.html" ! -path "*/node_modules/*" ! -path "*/android/*" ! -path "./dist/*" | head -n 1)
        if [ -n "$FOUND_INDEX" ]; then
          SRC_DIR=$(dirname "$FOUND_INDEX")
          cp -r $SRC_DIR/* dist/
        fi

    - name: Force Clean & Re-add Android
      run: |
        rm -rf android
        npx cap add android
        npx cap sync android

    - name: Replace App Icons Direct
      run: |
        npm install @capacitor/assets
        npx @capacitor/assets generate --iconPath public/icon-512.png --android || true

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Build APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: zad-alduat-app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
