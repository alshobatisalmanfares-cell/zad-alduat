name: Build Zad Alduat Native APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Dependencies
      run: npm install --legacy-peer-deps

    # خطوة حاسمة: بناء التطبيق والتأكد من وجود المخرجات
    - name: Build Web Assets
      run: |
        npm run build
        # التأكد من وجود index.html
        if [ ! -f "dist/index.html" ] && [ -f ".output/public/index.html" ]; then cp -r .output/public/* dist/; fi
        if [ ! -f "dist/index.html" ]; then echo "Error: Build failed to generate dist/index.html"; exit 1; fi

    - name: Sync Capacitor
      run: |
        rm -rf android
        npx cap add android
        npx cap sync android

    - name: Fix Android Icons
      run: |
        # تخصيص الأيقونات لتبدو أصلية
        ICON_SRC=$(find public -name "*icon-512*.png" | head -n 1)
        if [ -n "$ICON_SRC" ]; then
          for dir in android/app/src/main/res/mipmap-*; do
            cp -f "$ICON_SRC" "$dir/ic_launcher.png" 2>/dev/null || true
          done
        fi

    - name: Build Native APK
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
      
    - name: Gradle Build
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: zad-alduat-native-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
