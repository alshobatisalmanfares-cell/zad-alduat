name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Dependencies
      run: npm install

    - name: Build Web Assets
      run: npm run build || true

    - name: Ensure Dist Directory and Fallback Index
      run: |
        mkdir -p dist
        # في حال وجود مخرجات من البناء يتم نقلها
        if [ -d "build" ]; then cp -r build/* dist/; fi
        if [ -d "out" ]; then cp -r out/* dist/; fi
        
        # إنشاء ملف Entry Point لتفادي الخطأ وإحالة التطبيق لفتح الواجهة مباشرة
        if [ ! -f "dist/index.html" ]; then
          cat << 'EOF' > dist/index.html
          <!DOCTYPE html>
          <html lang="ar">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>زاد الدعاة</title>
            <style>
              body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #ffffff; }
              iframe { width: 100%; height: 100%; border: none; }
            </style>
          </head>
          <body>
            <iframe src="https://zad-alduat.lovable.app"></iframe>
          </body>
          </html>
          EOF
        fi

    - name: Configure Capacitor & Set Server URL
      run: |
        cat << 'EOF' > capacitor.config.json
        {
          "appId": "com.zad.alduat",
          "appName": "زاد الدعاة",
          "webDir": "dist",
          "server": {
            "url": "https://zad-alduat.lovable.app",
            "cleartext": true
          }
        }
        EOF

    - name: Clean & Sync Capacitor Android
      run: |
        rm -rf android
        npx cap add android
        npx cap sync android

    - name: Generate App Icons
      run: |
        npm install @capacitor/assets
        npx @capacitor/assets generate --iconPath public/icon-512.png --android || true

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Build APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: zad-alduat-app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
