name: Build Zad Alduat Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Use a clean SDK so runner image updates cannot change sdkmanager.
      ANDROID_HOME: ${{ runner.temp }}/zad-android-sdk
      ANDROID_SDK_ROOT: ${{ runner.temp }}/zad-android-sdk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Verify Android SDK components
        run: |
          sdkmanager --version
          test -f "$ANDROID_SDK_ROOT/platforms/android-36/android.jar"
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2"

      - name: Install dependencies
        run: bun install

      - name: Build web app
        run: bun run build

      - name: Create offline app page
        run: |
          bun scripts/android-shell.mjs
          test -f dist/client/index.html
          test -d dist/client/assets

      - name: Create Android project
        run: |
          rm -rf android
          bunx cap add android
          bunx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zad-alduat-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
